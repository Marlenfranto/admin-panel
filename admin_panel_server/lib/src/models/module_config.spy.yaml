class: ModuleConfig
table: module_config
fields:
  organization: Organization?, relation(optional)
  theoryModule: bool, default=false
  aiExpertModule: bool, default=false
  smartTrainingModule: bool, default=false
  assessmentModule: bool, default=false
  defaultLocaleKey: String, default='US-en', defaultPersist='US-en'
  ### DEPRECATED (future): legacy editor still reads/writes these. Made
  ### non-persistent so storage is clean; the editor's "Language Settings"
  ### section is the next thing to remove.
  defaultLanguage: String, default='en', !persist
  supportedLanguages: List<SupportedLanguage>?, !persist
  aiChatPrompt: String?
  aiChatPromptTranslations: List<LocalizedAiPrompt>?
  passingPercentage: int, default=60
indexes:
  module_config_organization_idx:
    fields: organizationId
    unique: true
