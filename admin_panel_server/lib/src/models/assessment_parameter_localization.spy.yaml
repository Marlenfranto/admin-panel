class: AssessmentParameterLocalization
table: assessment_parameter_localization
fields:
  parameter: AssessmentParameter?, relation(onDelete=Cascade)
  localeKey: String
  name: String
  description: String
  scoringFeedbacks: List<String>?
indexes:
  assessment_param_loc_unique_idx:
    fields: parameterId, localeKey
    unique: true
  assessment_param_loc_locale_idx:
    fields: localeKey
